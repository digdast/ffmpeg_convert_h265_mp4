apiVersion: v1
kind: Namespace
metadata:
  name: tools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ffmpeg-website-nginx-conf
  namespace: tools
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # Serve CLI installer scripts and Python modules as plain UTF-8 text (never octet-stream)
        location ~* \.(ps1|sh|cmd|bat|py|txt)$ {
            default_type text/plain;
            charset utf-8;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location = /install {
            default_type text/plain;
            charset utf-8;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Binary package artifacts
        location ~* ^/downloads/.*\.(exe|zip|deb|whl|gz)$ {
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg-website
  namespace: tools
  labels:
    app: ffmpeg-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ffmpeg-website
  template:
    metadata:
      labels:
        app: ffmpeg-website
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-cp-01
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: web-content
        hostPath:
          path: /var/lib/appdata/ffmpeg-website
          type: DirectoryOrCreate
      - name: nginx-conf
        configMap:
          name: ffmpeg-website-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-website-svc
  namespace: tools
  labels:
    app: ffmpeg-website
spec:
  type: NodePort
  selector:
    app: ffmpeg-website
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30086
