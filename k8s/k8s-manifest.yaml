apiVersion: v1
kind: Namespace
metadata:
  name: tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ffmpeg-website
  namespace: tools
  labels:
    app: ffmpeg-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ffmpeg-website
  template:
    metadata:
      labels:
        app: ffmpeg-website
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: web-content
        hostPath:
          path: /data/appdata/ffmpeg-website/html
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ffmpeg-website-svc
  namespace: tools
  labels:
    app: ffmpeg-website
spec:
  type: NodePort
  selector:
    app: ffmpeg-website
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30095
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ffmpeg-website-ingress
  namespace: tools
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
  - host: ffmpeg.ertech.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ffmpeg-website-svc
            port:
              number: 80
  - host: ffmpeg.ertechlab.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ffmpeg-website-svc
            port:
              number: 80
